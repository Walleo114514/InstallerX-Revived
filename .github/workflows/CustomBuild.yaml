name: Build with custom package name

on:
  # 手动触发：在仓库的 Actions 标签页点 "Run workflow" 按钮，
  # 可以在弹出的表单里临时改包名 / 编译变体，不用每次都改 yml
  workflow_dispatch:
    inputs:
      package_name:
        description: '目标包名 (applicationId)'
        required: true
        default: 'com.android.packageinstaller'
      build_variant:
        description: '编译任务名 (gradlew assemble 后面的部分，如 PreviewDebug / StableRelease)'
        required: true
        default: 'PreviewDebug'
      version_code:
        description: '目标 versionCode，必须明显高于你手机上原安装器的 version-long (你贴的是 16000003)'
        required: true
        default: '20000000'

  # 如果想改成"push 到某分支就自动编译"，取消下面注释即可
  # push:
  #   branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # 如果这里报 "invalid source release" 之类的版本错误，
          # 去仓库的 .github/workflows/pr-check.yml 或 README 里确认官方 CI 用的 JDK 版本，改成一致的
          java-version: '21'
          cache: 'gradle'

      # ubuntu-latest 镜像自带已配置好的 Android SDK (platform-tools/build-tools 都有，
      # license 也已预先接受)，不需要额外的 setup-android 步骤 ——
      # android-actions/setup-android@v3 默认会尝试装一个早已下架的 "tools" 包，反而会报错

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with custom package name and versionCode
        run: |
          ./gradlew "assemble${{ inputs.build_variant }}" \
            -PAPP_ID="${{ inputs.package_name }}" \
            -PVERSION_CODE="${{ inputs.version_code }}" \
            -Pgpr.user="${{ secrets.GPR_USER }}" \
            -Pgpr.key="${{ secrets.GPR_KEY }}" \
            --stacktrace
        # 说明：
        # - APP_ID 就是上面确认过的、控制 applicationId 的 Gradle 属性
        # - VERSION_CODE 是新加的：仓库官方文档只确认了 VERSION_NAME 有类似的
        #   Gradle 属性覆盖机制，没有确认 VERSION_CODE 也有 —— 如果 app/build.gradle.kts
        #   里没人读取这个属性，Gradle 不会报错，只会静默忽略，编译出来的
        #   versionCode 还是原来的值！构建完一定要看下一步 "Verify built APK" 的输出，
        #   确认 versionCode 真的变了，不要只看编译成功就假设生效了。
        #   如果没生效，需要在 app/build.gradle.kts 的 defaultConfig 里，把原来的
        #   `versionCode = <原表达式>` 改成：
        #   versionCode = (project.findProperty("VERSION_CODE") as String?)?.toIntOrNull() ?: (<原表达式>)
        # - gpr.user / gpr.key 是给可能存在的 GitHub Packages 依赖用的凭证，
        #   如果编译时没有报 401 / 找不到依赖 的错误，这两个参数留空也无所谓；
        #   如果报错了，去仓库 Settings → Secrets and variables → Actions
        #   新建 GPR_USER（你的 GitHub 用户名）和 GPR_KEY（一个有 read:packages
        #   权限的 Personal Access Token）这两个 secret 即可。

      - name: Locate built APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "没找到生成的 APK，检查上一步的编译日志"
            exit 1
          fi
          echo "找到 APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify built APK's package name and versionCode
        run: |
          AAPT=$(find "$ANDROID_HOME" -type f -name "aapt" 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$AAPT" ]; then
            echo "没找到 aapt，跳过校验（不影响 APK 本身，只是没法在这里自动核对）"
          else
            echo "==== APK 实际信息 ===="
            "$AAPT" dump badging "${{ steps.find_apk.outputs.apk_path }}" | grep -E "^package:|versionCode"
            echo "======================"
            echo "上面 package= 和 versionCode= 必须分别等于你填的 ${{ inputs.package_name }} 和 ${{ inputs.version_code }}"
          fi

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstallerX-${{ inputs.package_name }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14
